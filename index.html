<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Gallery with NSFW Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .upload-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }
        
        .upload-controls {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-input {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-block;
        }
        
        .file-input-label:hover {
            background: #45a049;
        }
        
        .ai-generate-section {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .prompt-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .generate-btn {
            background: #2196F3;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .generate-btn:hover {
            background: #1976D2;
        }
        
        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .image-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            position: relative;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
        }
        
        .image-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }
        
        .image-container.nsfw img {
            filter: blur(20px);
        }
        
        .image-container.nsfw:hover img {
            filter: blur(0px);
        }
        
        .nsfw-score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .nsfw-score.high {
            background: rgba(255,0,0,0.8);
        }
        
        .nsfw-score.medium {
            background: rgba(255,165,0,0.8);
        }
        
        .nsfw-score.low {
            background: rgba(0,128,0,0.8);
        }
        
        .image-info {
            padding: 15px;
        }
        
        .image-username {
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
        }
        
        .image-date {
            color: #999;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .nsfw-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }
        
        .analyzing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="module">
        import { pipeline } from '@xenova/transformers';
        
        class SimpleNSFWDetector {
            constructor() {
                this.classifier = null;
                this.isLoading = false;
                this.candidate_labels = ['safe', 'porn', 'sexy', 'hentai', 'neutral', 'drawing'];
            }

            async loadModel() {
                if (this.classifier) return this.classifier;
                if (this.isLoading) {
                    while (this.isLoading) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    return this.classifier;
                }

                try {
                    this.isLoading = true;
                    console.log('Loading NSFW detection model...');
                    this.classifier = await pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32');
                    console.log('NSFW model loaded successfully');
                    return this.classifier;
                } catch (error) {
                    console.error('Failed to load NSFW model:', error);
                    throw error;
                } finally {
                    this.isLoading = false;
                }
            }

            async analyzeImage(imageSource) {
                try {
                    const classifier = await this.loadModel();
                    const predictions = await classifier(imageSource, this.candidate_labels);
                    
                    const getScore = (label) => predictions.find(p => p.label === label)?.score || 0;

                    const pornScore = getScore('porn');
                    const sexyScore = getScore('sexy');
                    const hentaiScore = getScore('hentai');
                    
                    const riskScore = Math.round((pornScore + hentaiScore + sexyScore * 0.7) * 100);
                    
                    return {
                        riskScore,
                        isNSFW: riskScore > 50,
                        predictions,
                        categories: {
                            porn: Math.round(pornScore * 100),
                            sexy: Math.round(sexyScore * 100),
                            hentai: Math.round(hentaiScore * 100),
                            neutral: Math.round(getScore('neutral') * 100),
                            drawing: Math.round(getScore('drawing') * 100),
                            safe: Math.round(getScore('safe') * 100)
                        }
                    };
                } catch (error) {
                    console.error('Error analyzing image:', error);
                    throw error;
                }
            }
        }

        // Initialize global instances
        const room = new WebsimSocket();
        const nsfwDetector = new SimpleNSFWDetector();
        
        // Preload the model
        nsfwDetector.loadModel();
        
        window.nsfwDetector = nsfwDetector;
        window.room = room;
    </script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        function ImageGallery() {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [imageAnalysis, setImageAnalysis] = useState({});
            const fileInputRef = useRef(null);
            
            // Subscribe to images from database
            const images = React.useSyncExternalStore(
                window.room.collection('gallery_image').subscribe,
                window.room.collection('gallery_image').getList
            );
            
            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                
                try {
                    // Convert file to data URL for NSFW analysis
                    const dataURL = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    
                    // Analyze image before upload
                    const analysis = await window.nsfwDetector.analyzeImage(dataURL);
                    
                    // Upload to storage
                    const imageUrl = await websim.upload(file);
                    
                    // Save to database with analysis
                    await window.room.collection('gallery_image').create({
                        image_url: imageUrl,
                        analysis: analysis,
                        source: 'upload'
                    });
                    
                    // Clear file input
                    fileInputRef.current.value = '';
                    
                } catch (error) {
                    console.error('Upload failed:', error);
                    alert('Upload failed. Please try again.');
                } finally {
                    setIsUploading(false);
                }
            };
            
            const handleAIGenerate = async () => {
                if (!prompt.trim()) return;
                
                setIsGenerating(true);
                
                try {
                    // Generate image
                    const result = await websim.imageGen({
                        prompt: prompt,
                        aspect_ratio: '1:1'
                    });
                    
                    // Analyze the generated image
                    const analysis = await window.nsfwDetector.analyzeImage(result.url);
                    
                    // Save to database
                    await window.room.collection('gallery_image').create({
                        image_url: result.url,
                        prompt: prompt,
                        analysis: analysis,
                        source: 'ai_generated'
                    });
                    
                    setPrompt('');
                    
                } catch (error) {
                    console.error('AI generation failed:', error);
                    alert('AI generation failed. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };
            
            const getScoreClass = (score) => {
                if (score >= 70) return 'high';
                if (score >= 30) return 'medium';
                return 'low';
            };
            
            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString();
            };
            
            return (
                <div className="container">
                    <div className="header">
                        <h1>🎨 AI Image Gallery</h1>
                        <p>Upload images or generate them with AI • Automatic NSFW detection</p>
                    </div>
                    
                    <div className="upload-section">
                        <div className="upload-controls">
                            <div className="file-input-wrapper">
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept="image/*"
                                    onChange={handleFileUpload}
                                    className="file-input"
                                    id="file-input"
                                />
                                <label htmlFor="file-input" className="file-input-label">
                                    {isUploading ? '📤 Uploading...' : '📁 Upload Image'}
                                </label>
                            </div>
                            
                            <div className="ai-generate-section">
                                <input
                                    type="text"
                                    placeholder="Describe the image you want to generate..."
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    className="prompt-input"
                                    onKeyPress={(e) => e.key === 'Enter' && handleAIGenerate()}
                                />
                                <button
                                    onClick={handleAIGenerate}
                                    disabled={isGenerating || !prompt.trim()}
                                    className="generate-btn"
                                >
                                    {isGenerating ? '🎨 Generating...' : '✨ Generate AI Image'}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="gallery">
                        {images.reverse().map((image) => (
                            <ImageCard key={image.id} image={image} />
                        ))}
                    </div>
                    
                    {images.length === 0 && (
                        <div className="loading">
                            <p>No images yet. Upload or generate your first image!</p>
                        </div>
                    )}
                </div>
            );
        }
        
        function ImageCard({ image }) {
            const [isAnalyzing, setIsAnalyzing] = useState(!image.analysis);
            const [analysis, setAnalysis] = useState(image.analysis || null);
            
            useEffect(() => {
                if (!image.analysis) {
                    analyzeImage();
                }
            }, [image.id]);
            
            const analyzeImage = async () => {
                try {
                    setIsAnalyzing(true);
                    const result = await window.nsfwDetector.analyzeImage(image.image_url);
                    setAnalysis(result);
                    
                    // Update the database record with analysis
                    await window.room.collection('gallery_image').update(image.id, {
                        analysis: result
                    });
                    
                } catch (error) {
                    console.error('Analysis failed:', error);
                } finally {
                    setIsAnalyzing(false);
                }
            };
            
            const getScoreClass = (score) => {
                if (score >= 70) return 'high';
                if (score >= 30) return 'medium';
                return 'low';
            };
            
            return (
                <div className="image-card">
                    <div className={`image-container ${analysis?.isNSFW ? 'nsfw' : ''}`}>
                        <img src={image.image_url} alt={image.prompt || 'Uploaded image'} />
                        
                        {isAnalyzing && (
                            <div className="analyzing">
                                Analyzing...
                            </div>
                        )}
                        
                        {analysis && (
                            <div className={`nsfw-score ${getScoreClass(analysis.riskScore)}`}>
                                {analysis.riskScore}%
                            </div>
                        )}
                        
                        {analysis?.isNSFW && (
                            <div className="nsfw-warning">
                                NSFW Content
                            </div>
                        )}
                    </div>
                    
                    <div className="image-info">
                        <div className="image-username">
                            👤 {image.username}
                        </div>
                        {image.prompt && (
                            <div style={{ margin: '5px 0', fontSize: '14px', color: '#666' }}>
                                💭 {image.prompt}
                            </div>
                        )}
                        <div className="image-date">
                            📅 {new Date(image.created_at).toLocaleDateString()}
                        </div>
                        <div style={{ marginTop: '5px', fontSize: '12px', color: '#999' }}>
                            {image.source === 'ai_generated' ? '🤖 AI Generated' : '📁 Uploaded'}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<ImageGallery />, document.getElementById('root'));
    </script>

</body>
