<body>
    <div id="root"></div>
    
    <script type="module">
        import { pipeline } from '@xenova/transformers';
        
        class SimpleNSFWDetector {
            constructor() {
                this.classifier = null;
                this.isLoading = false;
                this.candidate_labels = ['safe', 'porn', 'sexy', 'hentai', 'neutral', 'drawing'];
            }

            async loadModel() {
                if (this.classifier) return this.classifier;
                if (this.isLoading) {
                    while (this.isLoading) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    return this.classifier;
                }

                try {
                    this.isLoading = true;
                    console.log('Loading NSFW detection model...');
                    this.classifier = await pipeline('zero-shot-image-classification', 'Xenova/clip-vit-base-patch32');
                    console.log('NSFW model loaded successfully');
                    return this.classifier;
                } catch (error) {
                    console.error('Failed to load NSFW model:', error);
                    throw error;
                } finally {
                    this.isLoading = false;
                }
            }

            async analyzeImage(imageSource) {
                try {
                    const classifier = await this.loadModel();
                    const predictions = await classifier(imageSource, this.candidate_labels);
                    
                    const getScore = (label) => predictions.find(p => p.label === label)?.score || 0;

                    const pornScore = getScore('porn');
                    const sexyScore = getScore('sexy');
                    const hentaiScore = getScore('hentai');
                    
                    const riskScore = Math.round((pornScore + hentaiScore + sexyScore * 0.7) * 100);
                    
                    return {
                        riskScore,
                        isNSFW: riskScore > 50,
                        predictions,
                        categories: {
                            porn: Math.round(pornScore * 100),
                            sexy: Math.round(sexyScore * 100),
                            hentai: Math.round(hentaiScore * 100),
                            neutral: Math.round(getScore('neutral') * 100),
                            drawing: Math.round(getScore('drawing') * 100),
                            safe: Math.round(getScore('safe') * 100)
                        }
                    };
                } catch (error) {
                    console.error('Error analyzing image:', error);
                    throw error;
                }
            }
        }

        // Initialize global instances
        const room = new WebsimSocket();
        const nsfwDetector = new SimpleNSFWDetector();
        
        // Preload the model
        nsfwDetector.loadModel();
        
        window.nsfwDetector = nsfwDetector;
        window.room = room;
    </script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Move getScoreClass outside of components so it can be accessed by both
        const getScoreClass = (score) => {
            if (score >= 70) return 'high';
            if (score >= 30) return 'medium';
            return 'low';
        };
        
        function ImageGallery() {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [imageAnalysis, setImageAnalysis] = useState({});
            const [viewMode, setViewMode] = useState('all'); // 'all' or 'my'
            const [currentUser, setCurrentUser] = useState(null);
            const [remixModal, setRemixModal] = useState(null);
            const fileInputRef = useRef(null);
            
            // Get current user
            useEffect(() => {
                const getCurrentUser = async () => {
                    try {
                        const user = await window.websim.getCurrentUser();
                        setCurrentUser(user);
                    } catch (error) {
                        console.error('Error getting current user:', error);
                    }
                };
                getCurrentUser();
            }, []);
            
            // Subscribe to images from database
            const allImages = React.useSyncExternalStore(
                window.room.collection('gallery_image').subscribe,
                window.room.collection('gallery_image').getList
            );
            
            // Filter images based on view mode
            const images = viewMode === 'my' && currentUser 
                ? allImages.filter(img => img.username === currentUser.username)
                : allImages;
            
            const myImagesCount = currentUser 
                ? allImages.filter(img => img.username === currentUser.username).length
                : 0;
            
            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                
                try {
                    // Convert file to data URL for NSFW analysis
                    const dataURL = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    
                    // Analyze image before upload
                    const analysis = await window.nsfwDetector.analyzeImage(dataURL);
                    
                    // Upload to storage
                    const imageUrl = await websim.upload(file);
                    
                    // Save to database with analysis
                    await window.room.collection('gallery_image').create({
                        image_url: imageUrl,
                        analysis: analysis,
                        source: 'upload'
                    });
                    
                    // Clear file input
                    fileInputRef.current.value = '';
                    
                } catch (error) {
                    console.error('Upload failed:', error);
                    alert('Upload failed. Please try again.');
                } finally {
                    setIsUploading(false);
                }
            };
            
            const handleAIGenerate = async () => {
                if (!prompt.trim()) return;
                
                setIsGenerating(true);
                
                try {
                    // Generate image
                    const result = await websim.imageGen({
                        prompt: prompt,
                        aspect_ratio: '1:1'
                    });
                    
                    // Analyze the generated image
                    const analysis = await window.nsfwDetector.analyzeImage(result.url);
                    
                    // Save to database
                    await window.room.collection('gallery_image').create({
                        image_url: result.url,
                        prompt: prompt,
                        analysis: analysis,
                        source: 'ai_generated'
                    });
                    
                    setPrompt('');
                    
                } catch (error) {
                    console.error('AI generation failed:', error);
                    alert('AI generation failed. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };
            
            const handleRemix = (image) => {
                setRemixModal(image);
            };
            
            const closeRemixModal = () => {
                setRemixModal(null);
            };
            
            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString();
            };
            
            return (
                <div className="container">
                    <div className="header">
                        <h1>🎨 AI Image Gallery</h1>
                        <p>Upload images or generate them with AI • Automatic NSFW detection</p>
                    </div>
                    
                    <div className="upload-section">
                        <div className="upload-controls">
                            <div className="file-input-wrapper">
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept="image/*"
                                    onChange={handleFileUpload}
                                    className="file-input"
                                    id="file-input"
                                />
                                <label htmlFor="file-input" className="file-input-label">
                                    {isUploading ? '📤 Uploading...' : '📁 Upload Image'}
                                </label>
                            </div>
                            
                            <div className="ai-generate-section">
                                <input
                                    type="text"
                                    placeholder="Describe the image you want to generate..."
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    className="prompt-input"
                                    onKeyPress={(e) => e.key === 'Enter' && handleAIGenerate()}
                                />
                                <button
                                    onClick={handleAIGenerate}
                                    disabled={isGenerating || !prompt.trim()}
                                    className="generate-btn"
                                >
                                    {isGenerating ? '🎨 Generating...' : '✨ Generate AI Image'}
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div className="view-toggle">
                        <button 
                            className={`toggle-btn ${viewMode === 'all' ? 'active' : ''}`}
                            onClick={() => setViewMode('all')}
                        >
                            🌍 All Images ({allImages.length})
                        </button>
                        <button 
                            className={`toggle-btn ${viewMode === 'my' ? 'active' : ''}`}
                            onClick={() => setViewMode('my')}
                        >
                            👤 My Images ({myImagesCount})
                        </button>
                    </div>
                    
                    {viewMode === 'my' && (
                        <div className="user-stats">
                            <p>Managing images for: <strong>{currentUser?.username || 'Loading...'}</strong></p>
                        </div>
                    )}
                    
                    <div className="gallery">
                        {images.reverse().map((image) => (
                            <ImageCard 
                                key={image.id} 
                                image={image} 
                                showManageOptions={viewMode === 'my'}
                                currentUser={currentUser}
                                onRemix={handleRemix}
                            />
                        ))}
                    </div>
                    
                    {images.length === 0 && viewMode === 'all' && (
                        <div className="loading">
                            <p>No images yet. Upload or generate your first image!</p>
                        </div>
                    )}
                    
                    {images.length === 0 && viewMode === 'my' && (
                        <div className="loading">
                            <p>You haven't uploaded or generated any images yet.</p>
                        </div>
                    )}
                    
                    {remixModal && (
                        <RemixModal 
                            image={remixModal} 
                            onClose={closeRemixModal}
                        />
                    )}
                </div>
            );
        }
        
        function RemixModal({ image, onClose }) {
            const [userDescription, setUserDescription] = useState('');
            const [aiDescription, setAiDescription] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [analysisError, setAnalysisError] = useState(false);
            
            useEffect(() => {
                analyzeImageForRemix();
            }, [image]);
            
            const analyzeImageForRemix = async () => {
                setIsAnalyzing(true);
                setAnalysisError(false);
                
                try {
                    const completion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: "Analyze this image and provide a detailed description that could be used to generate a similar image. Focus on the main subject, style, colors, composition, mood, and any distinctive features. Be specific and descriptive."
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: image.image_url }
                                    }
                                ]
                            }
                        ]
                    });
                    
                    setAiDescription(completion.content);
                } catch (error) {
                    console.error('Error analyzing image:', error);
                    setAnalysisError(true);
                    setAiDescription('');
                } finally {
                    setIsAnalyzing(false);
                }
            };
            
            const handleGenerate = async () => {
                if (!userDescription.trim()) {
                    alert('Please provide a description for the remix since AI analysis failed.');
                    return;
                }
                
                setIsGenerating(true);
                try {
                    // Use user description as the main prompt when AI analysis fails
                    let combinedPrompt = userDescription.trim();
                    if (aiDescription) {
                        combinedPrompt = `${aiDescription}\n\nAdditional modifications: ${userDescription}`;
                    }
                    
                    // Generate new image
                    const result = await websim.imageGen({
                        prompt: combinedPrompt,
                        aspect_ratio: '1:1'
                    });
                    
                    // Analyze the generated image
                    const analysis = await window.nsfwDetector.analyzeImage(result.url);
                    
                    // Save to database with remix history
                    await window.room.collection('gallery_image').create({
                        image_url: result.url,
                        prompt: combinedPrompt,
                        analysis: analysis,
                        source: 'remix',
                        original_image_id: image.id,
                        remix_description: userDescription.trim(),
                        ai_description: aiDescription || 'AI analysis failed',
                        remix_parent_username: image.username
                    });
                    
                    onClose();
                    
                } catch (error) {
                    console.error('Remix generation failed:', error);
                    alert('Remix generation failed. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };
            
            return (
                <div className="remix-modal" onClick={onClose}>
                    <div className="remix-modal-content" onClick={(e) => e.stopPropagation()}>
                        <h3>🎨 Remix Image</h3>
                        
                        {isAnalyzing ? (
                            <div className="ai-description">
                                <h4>🤖 AI Analysis</h4>
                                <p>Analyzing image...</p>
                            </div>
                        ) : analysisError ? (
                            <div className="ai-description" style={{ background: 'rgba(245, 158, 11, 0.1)', borderColor: 'rgba(245, 158, 11, 0.3)' }}>
                                <h4>⚠️ AI Analysis Failed</h4>
                                <p>Unable to analyze the image automatically. Please provide your own description below to create a remix.</p>
                                <button 
                                    onClick={analyzeImageForRemix}
                                    style={{ 
                                        marginTop: '8px', 
                                        padding: '6px 12px', 
                                        background: 'rgba(245, 158, 11, 0.2)', 
                                        border: '1px solid rgba(245, 158, 11, 0.3)',
                                        borderRadius: '6px',
                                        color: 'white',
                                        cursor: 'pointer',
                                        fontSize: '12px'
                                    }}
                                >
                                    🔄 Retry Analysis
                                </button>
                            </div>
                        ) : aiDescription ? (
                            <div className="ai-description">
                                <h4>🤖 AI Description</h4>
                                <p>{aiDescription}</p>
                            </div>
                        ) : null}
                        
                        <textarea
                            value={userDescription}
                            onChange={(e) => setUserDescription(e.target.value)}
                            placeholder={analysisError ? 
                                "Describe the image and any modifications you want to make..." : 
                                "Add your own modifications or leave blank to generate a similar image..."}
                            disabled={isAnalyzing}
                            style={{ minHeight: analysisError ? '120px' : '100px' }}
                        />
                        
                        <div className="remix-modal-actions">
                            <button 
                                className="remix-modal-btn remix-cancel-btn"
                                onClick={onClose}
                                disabled={isGenerating}
                            >
                                Cancel
                            </button>
                            <button 
                                className="remix-modal-btn remix-generate-btn"
                                onClick={handleGenerate}
                                disabled={isAnalyzing || isGenerating || (analysisError && !userDescription.trim())}
                            >
                                {isGenerating ? '🎨 Generating...' : '✨ Generate Remix'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        
        function ImageCard({ image, showManageOptions, currentUser, onRemix }) {
            const [isAnalyzing, setIsAnalyzing] = useState(!image.analysis);
            const [analysis, setAnalysis] = useState(image.analysis || null);
            const [isDeleting, setIsDeleting] = useState(false);
            
            useEffect(() => {
                if (!image.analysis) {
                    analyzeImage();
                }
            }, [image.id]);
            
            const analyzeImage = async () => {
                try {
                    setIsAnalyzing(true);
                    const result = await window.nsfwDetector.analyzeImage(image.image_url);
                    setAnalysis(result);
                    
                    // Update the database record with analysis
                    await window.room.collection('gallery_image').update(image.id, {
                        analysis: result
                    });
                    
                } catch (error) {
                    console.error('Analysis failed:', error);
                } finally {
                    setIsAnalyzing(false);
                }
            };
            
            const handleDownload = async () => {
                try {
                    const response = await fetch(image.image_url);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `image_${image.id}.png`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } catch (error) {
                    console.error('Download failed:', error);
                    alert('Download failed. Please try again.');
                }
            };
            
            const handleDelete = async () => {
                if (!confirm('Are you sure you want to delete this image?')) return;
                
                try {
                    setIsDeleting(true);
                    await window.room.collection('gallery_image').delete(image.id);
                } catch (error) {
                    console.error('Delete failed:', error);
                    alert('Delete failed. Please try again.');
                } finally {
                    setIsDeleting(false);
                }
            };
            
            const canManage = currentUser && image.username === currentUser.username;
            
            return (
                <div className="image-card">
                    <div className={`image-container ${analysis?.isNSFW ? 'nsfw' : ''}`}>
                        <img src={image.image_url} alt={image.prompt || 'Uploaded image'} />
                        
                        {isAnalyzing && (
                            <div className="analyzing">
                                Analyzing...
                            </div>
                        )}
                        
                        {analysis && (
                            <div className={`nsfw-score ${getScoreClass(analysis.riskScore)}`}>
                                {analysis.riskScore}%
                            </div>
                        )}
                        
                        {analysis?.isNSFW && (
                            <div className="nsfw-warning">
                                NSFW Content
                            </div>
                        )}
                    </div>
                    
                    <div className="image-info">
                        <div className="image-username">
                            👤 {image.username}
                        </div>
                        {image.prompt && (
                            <div style={{ margin: '5px 0', fontSize: '14px', color: '#666' }}>
                                💭 {image.prompt}
                            </div>
                        )}
                        <div className="image-date">
                            📅 {new Date(image.created_at).toLocaleDateString()}
                        </div>
                        <div style={{ marginTop: '5px', fontSize: '12px', color: '#999' }}>
                            {image.source === 'ai_generated' ? '🤖 AI Generated' : 
                             image.source === 'remix' ? '🎨 Remix' : '📁 Uploaded'}
                        </div>
                        
                        {image.source === 'remix' && (
                            <div className="remix-history">
                                <strong>Remixed from:</strong> {image.remix_parent_username}'s image
                                {image.remix_description && (
                                    <div style={{ marginTop: '4px' }}>
                                        <strong>Modifications:</strong> {image.remix_description}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        <div className="image-actions">
                            <button 
                                className="action-btn download-btn" 
                                onClick={handleDownload}
                                title="Download image"
                            >
                                ⬇️ Download
                            </button>
                            
                            <button 
                                className="action-btn remix-btn" 
                                onClick={() => onRemix(image)}
                                title="Remix this image"
                            >
                                🎨 Remix
                            </button>
                            
                            {(showManageOptions && canManage) && (
                                <button 
                                    className="action-btn delete-btn" 
                                    onClick={handleDelete}
                                    disabled={isDeleting}
                                    title="Delete image"
                                >
                                    {isDeleting ? '🗑️ Deleting...' : '🗑️ Delete'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<ImageGallery />, document.getElementById('root'));
    </script>
